<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbes du 3e groupe</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --surface: #17171a;
    --card: #1e1e23;
    --accent: #c8a96e;
    --accent2: #7ecfc0;
    --wrong: #e06b6b;
    --text: #f0ede8;
    --muted: #888;
    --border: #2e2e35;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    color: var(--accent);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
    text-align: center;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 36px;
    text-align: center;
  }

  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    background: var(--surface);
    border-radius: 12px;
    padding: 6px;
    border: 1px solid var(--border);
  }

  .mode-tab {
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }

  .mode-tab.active {
    background: var(--accent);
    color: #000;
    font-weight: 500;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    width: 100%;
    max-width: 560px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(200,169,110,0.08), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .verb-label {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .verb-display {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 3rem);
    color: var(--accent);
    margin-bottom: 6px;
    line-height: 1.1;
  }

  .verb-meaning {
    color: var(--muted);
    font-size: 0.82rem;
    margin-bottom: 28px;
    min-height: 20px;
  }

  .prompt {
    font-size: 0.85rem;
    color: var(--text);
    margin-bottom: 18px;
    line-height: 1.6;
  }

  .pronoun-highlight {
    color: var(--accent2);
    font-weight: 500;
  }

  input[type="text"] {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 14px;
  }

  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"].correct { border-color: var(--accent2); background: rgba(126,207,192,0.06); }
  input[type="text"].wrong { border-color: var(--wrong); background: rgba(224,107,107,0.06); }

  .btn-row {
    display: flex;
    gap: 10px;
  }

  button.primary {
    flex: 1;
    padding: 13px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: opacity 0.2s, transform 0.1s;
  }

  button.primary:hover { opacity: 0.88; transform: translateY(-1px); }
  button.primary:active { transform: translateY(0); }

  button.secondary {
    padding: 13px 18px;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    cursor: pointer;
    transition: color 0.2s;
  }

  button.secondary:hover { color: var(--text); }

  .feedback {
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 0.85rem;
    line-height: 1.6;
    display: none;
  }

  .feedback.show { display: block; }
  .feedback.correct { background: rgba(126,207,192,0.1); border: 1px solid rgba(126,207,192,0.3); color: var(--accent2); }
  .feedback.wrong { background: rgba(224,107,107,0.08); border: 1px solid rgba(224,107,107,0.25); color: var(--wrong); }

  .score-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 560px;
    margin-bottom: 16px;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .score-dots {
    display: flex;
    gap: 5px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s;
  }

  .dot.correct { background: var(--accent2); }
  .dot.wrong { background: var(--wrong); }

  /* Conjugation table mode */
  .table-verb-select {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    outline: none;
    margin-bottom: 22px;
    cursor: pointer;
  }

  .conj-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .conj-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
  }

  .conj-pronoun {
    font-size: 0.7rem;
    color: var(--accent2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .conj-form {
    font-size: 1rem;
    color: var(--text);
  }

  .conj-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    outline: none;
    padding: 2px 0;
    transition: border-color 0.2s;
  }

  .conj-input:focus { border-color: var(--accent); }
  .conj-input.ok { border-color: var(--accent2); color: var(--accent2); }
  .conj-input.bad { border-color: var(--wrong); color: var(--wrong); }

  .table-btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .progress-text {
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<h1>Verbes du 3e groupe</h1>
<p class="subtitle">Тренажер · Conjugaison</p>

<div class="mode-tabs">
  <button class="mode-tab active" onclick="setMode('quiz')">Quiz</button>
  <button class="mode-tab" onclick="setMode('table')">Tableau</button>
  <button class="mode-tab" onclick="setMode('list')">Liste</button>
</div>

<!-- QUIZ MODE -->
<div id="mode-quiz">
  <div class="score-bar">
    <span class="progress-text" id="progress-text">0 / 0</span>
    <div class="score-dots" id="score-dots"></div>
    <span id="score-count">✓ 0</span>
  </div>
  <div class="card">
    <div class="verb-label">Conjuguez le verbe</div>
    <div class="verb-display" id="quiz-verb">—</div>
    <div class="verb-meaning" id="quiz-meaning"></div>
    <p class="prompt">Forme : <span class="pronoun-highlight" id="quiz-pronoun">—</span> + <span id="quiz-tense">Présent</span></p>
    <input type="text" id="quiz-input" placeholder="votre réponse..." onkeydown="if(event.key==='Enter') checkAnswer()">
    <div class="btn-row">
      <button class="primary" onclick="checkAnswer()">Vérifier</button>
      <button class="secondary" onclick="giveHint()" id="hint-btn">💡 Indice</button>
      <button class="secondary" onclick="skipQuestion()">→ Passer</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<!-- TABLE MODE -->
<div id="mode-table" style="display:none; width:100%; max-width:560px;">
  <div class="card">
    <div class="verb-label">Choisissez un verbe</div>
    <select class="table-verb-select" id="table-select" onchange="loadTable()"></select>
    <div class="conj-grid" id="conj-grid"></div>
    <div class="table-btn-row">
      <button class="primary" onclick="checkTable()">Vérifier tout</button>
      <button class="secondary" onclick="showTable()">Afficher</button>
    </div>
  </div>
</div>

<!-- LIST MODE -->
<div id="mode-list" style="display:none; width:100%; max-width:560px;">
  <div class="card">
    <div class="verb-label">Tous les verbes</div>
    <div id="verb-list" style="margin-top:10px;"></div>
  </div>
</div>

<script>
const verbs = [
  { inf: "aller", meaning: "іти / їхати", forms: { je:"vais", tu:"vas", il:"va", nous:"allons", vous:"allez", ils:"vont" },
    hints: {
      je: "⚠️ Нестандартно! Корінь змінюється на «va-». Схоже на іспанське «voy»",
      tu: "⚠️ Корінь «va-». Додай закінчення -s як у більшості дієслів",
      il: "⚠️ Найкоротша форма — лише 2 літери, без закінчення",
      nous: "✅ Тут корінь повертається до «all-» — звичне закінчення -ons",
      vous: "✅ Корінь «all-» + звичне закінчення -ez",
      ils: "⚠️ Знову нестандартний корінь «v-» + закінчення -ont (як у sont, ont)"
    }
  },
  { inf: "avoir", meaning: "мати", forms: { je:"ai", tu:"as", il:"a", nous:"avons", vous:"avez", ils:"ont" },
    hints: {
      je: "💡 Дуже коротко! Лише 2 літери. Без займенника звучало б як «j'___»",
      tu: "💡 Схоже на англійське «has» — та сама коренева голосна «a»",
      il: "💡 Ще коротше ніж je — лише 1 літера + «a»",
      nous: "✅ Стандартне закінчення -ons, корінь «av-»",
      vous: "✅ Стандартне закінчення -ez, корінь «av-»",
      ils: "⚠️ Єдина форма без «av-»! Схожа на «ils sont» — замість «s» тут «nt»"
    }
  },
  { inf: "être", meaning: "бути", forms: { je:"suis", tu:"es", il:"est", nous:"sommes", vous:"êtes", ils:"sont" },
    hints: {
      je: "⚠️ Нічого спільного з інфінітивом! Корінь «su-». Схоже на «suivre»",
      tu: "💡 Найкоротша форма — лише 2 літери, як в англійському «is»",
      il: "💡 Як «tu es» + мовчазне «t». Вимовляється однаково!",
      nous: "⚠️ Зовсім інший корінь «somm-». Запам'ятай: «nous sommes»",
      vous: "⚠️ Єдиний випадок accent circonflexe на «ê». Закінчення -es замість -ez",
      ils: "💡 Схоже на англійське «are». Корінь «s-» + закінчення -ont"
    }
  },
  { inf: "faire", meaning: "робити", forms: { je:"fais", tu:"fais", il:"fait", nous:"faisons", vous:"faites", ils:"font" },
    hints: {
      je: "💡 Корінь «fai-». Схоже на інфінітив без «re»",
      tu: "💡 Ідентична формі «je» — рідкість для 3-ї групи",
      il: "💡 Як «tu fais» + мовчазне «t»",
      nous: "⚠️ Вимовляється «fə-zɔ̃» — буква «i» стає майже невимовною!",
      vous: "⚠️ Виняток! Закінчення -es замість -ez, як у «être»",
      ils: "⚠️ Корінь скорочується до «f-» + закінчення -ont (як у ils ont, ils vont)"
    }
  },
  { inf: "pouvoir", meaning: "могти", forms: { je:"peux", tu:"peux", il:"peut", nous:"pouvons", vous:"pouvez", ils:"peuvent" },
    hints: {
      je: "⚠️ Закінчення -x замість -s! Так само у «vouloir»",
      tu: "⚠️ Ідентична «je» — закінчення -x. Корінь «peu-»",
      il: "💡 Як «tu peux» але з «t» замість «x» — вимовляються однаково",
      nous: "✅ Корінь повертається до «pouv-» + стандартне -ons",
      vous: "✅ Корінь «pouv-» + стандартне -ez",
      ils: "⚠️ Корінь знову «peu-» + закінчення -vent (як у ils veulent)"
    }
  },
  { inf: "vouloir", meaning: "хотіти", forms: { je:"veux", tu:"veux", il:"veut", nous:"voulons", vous:"voulez", ils:"veulent" },
    hints: {
      je: "⚠️ Закінчення -x як у «pouvoir». Корінь «veu-»",
      tu: "⚠️ Ідентична «je». Запам'ятай пару: peux/veux, peux/veux",
      il: "💡 Корінь «veu-» + «t». Вимовляється як «vø»",
      nous: "⚠️ Корінь змінюється на «voul-» + стандартне -ons",
      vous: "✅ Корінь «voul-» + стандартне -ez",
      ils: "⚠️ Корінь «veul-» + закінчення -ent. Схоже на ils peuvent!"
    }
  },
  { inf: "savoir", meaning: "знати", forms: { je:"sais", tu:"sais", il:"sait", nous:"savons", vous:"savez", ils:"savent" },
    hints: {
      je: "💡 Корінь «sai-» + -s. Схоже на інфінітив без «voir»",
      tu: "💡 Ідентична «je sais»",
      il: "💡 «sai-» + мовчазне «t»",
      nous: "✅ Корінь «sav-» + стандартне -ons",
      vous: "✅ Корінь «sav-» + стандартне -ez",
      ils: "✅ Корінь «sav-» + стандартне -ent"
    }
  },
  { inf: "venir", meaning: "приходити", forms: { je:"viens", tu:"viens", il:"vient", nous:"venons", vous:"venez", ils:"viennent" },
    hints: {
      je: "💡 Корінь «vien-» з носовим звуком. Схоже на «bien»",
      tu: "💡 Ідентична «je viens»",
      il: "💡 «vien-» + мовчазне «t»",
      nous: "⚠️ Корінь скорочується до «ven-» + -ons. Без носового!",
      vous: "⚠️ Корінь «ven-» + -ez. Без носового!",
      ils: "⚠️ Корінь знову «vienn-» (подвійне n) + -ent. Звук носовий повертається!"
    }
  },
  { inf: "partir", meaning: "від'їжджати", forms: { je:"pars", tu:"pars", il:"part", nous:"partons", vous:"partez", ils:"partent" },
    hints: {
      je: "💡 Відкидаємо -ir і букву «t»: partir → par + s",
      tu: "💡 Ідентична «je pars»",
      il: "💡 «par» + «t» — та сама літера що відкинули, повертається!",
      nous: "✅ Повний корінь «part-» + стандартне -ons",
      vous: "✅ Повний корінь «part-» + стандартне -ez",
      ils: "✅ Повний корінь «part-» + стандартне -ent"
    }
  },
  { inf: "prendre", meaning: "брати", forms: { je:"prends", tu:"prends", il:"prend", nous:"prenons", vous:"prenez", ils:"prennent" },
    hints: {
      je: "💡 Відкидаємо -re: prendre → prend + s (але «d» мовчазне)",
      tu: "💡 Ідентична «je prends»",
      il: "💡 Як «je prends» але без «s» — «d» залишається мовчазним",
      nous: "⚠️ Корінь скорочується: «pren-» (одне n) + -ons",
      vous: "⚠️ «pren-» + -ez",
      ils: "⚠️ Подвійне «nn»: «prenn-» + -ent"
    }
  },
  { inf: "mettre", meaning: "класти / одягати", forms: { je:"mets", tu:"mets", il:"met", nous:"mettons", vous:"mettez", ils:"mettent" },
    hints: {
      je: "💡 Відкидаємо -tre: mettre → met + s",
      tu: "💡 Ідентична «je mets»",
      il: "💡 Просто «met» без закінчення",
      nous: "⚠️ Подвійне «tt»: «mett-» + -ons",
      vous: "⚠️ Подвійне «tt»: «mett-» + -ez",
      ils: "⚠️ Подвійне «tt»: «mett-» + -ent"
    }
  },
  { inf: "dire", meaning: "говорити", forms: { je:"dis", tu:"dis", il:"dit", nous:"disons", vous:"dites", ils:"disent" },
    hints: {
      je: "💡 Відкидаємо -re: dire → di + s",
      tu: "💡 Ідентична «je dis»",
      il: "💡 «di» + «t» — мовчазне",
      nous: "✅ Корінь «dis-» + стандартне -ons",
      vous: "⚠️ Виняток! Закінчення -es замість -ez (як у faites, êtes)",
      ils: "✅ Корінь «dis-» + стандартне -ent"
    }
  },
  { inf: "voir", meaning: "бачити", forms: { je:"vois", tu:"vois", il:"voit", nous:"voyons", vous:"voyez", ils:"voient" },
    hints: {
      je: "💡 Корінь «voi-» + -s",
      tu: "💡 Ідентична «je vois»",
      il: "💡 «voi-» + мовчазне «t»",
      nous: "⚠️ Корінь змінюється на «voy-» + -ons. Як у «voyage»!",
      vous: "⚠️ «voy-» + -ez",
      ils: "⚠️ «voi-» + -ent. Корінь повертається до «voi-»"
    }
  },
  { inf: "lire", meaning: "читати", forms: { je:"lis", tu:"lis", il:"lit", nous:"lisons", vous:"lisez", ils:"lisent" },
    hints: {
      je: "💡 Відкидаємо -re: lire → li + s",
      tu: "💡 Ідентична «je lis»",
      il: "💡 «li» + мовчазне «t»",
      nous: "✅ Корінь «lis-» + стандартне -ons",
      vous: "✅ Корінь «lis-» + стандартне -ez",
      ils: "✅ Корінь «lis-» + стандартне -ent"
    }
  },
  { inf: "écrire", meaning: "писати", forms: { je:"écris", tu:"écris", il:"écrit", nous:"écrivons", vous:"écrivez", ils:"écrivent" },
    hints: {
      je: "💡 Відкидаємо -re: écrire → écri + s",
      tu: "💡 Ідентична «j'écris»",
      il: "💡 «écri» + мовчазне «t»",
      nous: "⚠️ Корінь змінюється: «écriv-» + -ons. З'являється «v»!",
      vous: "⚠️ «écriv-» + -ez. З'являється «v»!",
      ils: "⚠️ «écriv-» + -ent. З'являється «v»!"
    }
  },
  { inf: "sortir", meaning: "виходити", forms: { je:"sors", tu:"sors", il:"sort", nous:"sortons", vous:"sortez", ils:"sortent" },
    hints: {
      je: "💡 Як «partir»: відкидаємо -ir і «t»: sortir → sor + s",
      tu: "💡 Ідентична «je sors»",
      il: "💡 «sor» + «t» — та сама буква повертається",
      nous: "✅ Повний корінь «sort-» + -ons",
      vous: "✅ Повний корінь «sort-» + -ez",
      ils: "✅ Повний корінь «sort-» + -ent"
    }
  },
  { inf: "tenir", meaning: "тримати", forms: { je:"tiens", tu:"tiens", il:"tient", nous:"tenons", vous:"tenez", ils:"tiennent" },
    hints: {
      je: "💡 Як «venir»: корінь «tien-» з носовим. Запам'ятай пару: venir/tenir",
      tu: "💡 Ідентична «je tiens»",
      il: "💡 «tien-» + мовчазне «t»",
      nous: "⚠️ Корінь «ten-» без носового + -ons. Як у «venir → venons»",
      vous: "⚠️ Корінь «ten-» + -ez",
      ils: "⚠️ «tienn-» (подвійне n) + -ent. Як у ils viennent!"
    }
  },
  { inf: "devoir", meaning: "повинен", forms: { je:"dois", tu:"dois", il:"doit", nous:"devons", vous:"devez", ils:"doivent" },
    hints: {
      je: "💡 Корінь «doi-» + -s. Схоже на «loi», «foi»",
      tu: "💡 Ідентична «je dois»",
      il: "💡 «doi-» + мовчазне «t»",
      nous: "⚠️ Корінь змінюється на «dev-» + -ons. Голосна «oi» → «e»",
      vous: "⚠️ Корінь «dev-» + -ez",
      ils: "⚠️ Корінь «doiv-» + -ent. З'являється «v»! Як у ils reçoivent"
    }
  },
];

const pronouns = ["je", "tu", "il", "nous", "vous", "ils"];
let queue = [];
let current = null;
let score = 0;
let total = 0;
let history = [];

function buildQueue() {
  queue = [];
  verbs.forEach(v => {
    pronouns.forEach(p => queue.push({ verb: v, pronoun: p }));
  });
  shuffle(queue);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function nextQuestion() {
  if (queue.length === 0) buildQueue();
  current = queue.pop();
  document.getElementById('quiz-verb').textContent = current.verb.inf;
  document.getElementById('quiz-meaning').textContent = current.verb.meaning;
  document.getElementById('quiz-pronoun').textContent = current.pronoun;
  const inp = document.getElementById('quiz-input');
  inp.value = '';
  inp.className = '';
  inp.focus();
  hintLevel = 0;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').style = '';
  updateProgress();
}

function checkAnswer() {
  if (!current) return;
  const inp = document.getElementById('quiz-input');
  const answer = inp.value.trim().toLowerCase();
  const correct = current.verb.forms[current.pronoun];
  const fb = document.getElementById('feedback');
  total++;

  if (answer === correct) {
    inp.className = 'correct';
    fb.className = 'feedback correct show';
    fb.textContent = '✓ Correct !';
    score++;
    history.push('correct');
    setTimeout(nextQuestion, 900);
  } else {
    inp.className = 'wrong';
    fb.className = 'feedback wrong show';
    fb.innerHTML = `✗ &nbsp; ${current.pronoun} → <strong>${correct}</strong>`;
    history.push('wrong');
    setTimeout(nextQuestion, 1800);
  }
  updateProgress();
}

let hintLevel = 0;
function giveHint() {
  if (!current) return;
  const correct = current.verb.forms[current.pronoun];
  const hint = current.verb.hints && current.verb.hints[current.pronoun];
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show';
  fb.style.background = 'rgba(200,169,110,0.08)';
  fb.style.border = '1px solid rgba(200,169,110,0.25)';
  fb.style.color = 'var(--accent)';
  hintLevel++;
  if (hintLevel === 1 && hint) {
    fb.textContent = hint;
  } else if (hintLevel === 2) {
    const masked = correct.slice(0, Math.ceil(correct.length * 0.6)) + '...';
    fb.textContent = `📝 Починається так: « ${masked} »`;
  } else {
    fb.textContent = `✅ Відповідь: « ${correct} »`;
  }
  document.getElementById('quiz-input').focus();
}

function skipQuestion() {
  history.push('skip');
  nextQuestion();
}

function updateProgress() {
  document.getElementById('progress-text').textContent = `${total} réponses`;
  document.getElementById('score-count').textContent = `✓ ${score}`;
  const dots = document.getElementById('score-dots');
  dots.innerHTML = '';
  const last = history.slice(-10);
  last.forEach(h => {
    const d = document.createElement('div');
    d.className = 'dot ' + (h === 'correct' ? 'correct' : h === 'wrong' ? 'wrong' : '');
    dots.appendChild(d);
  });
}

// TABLE MODE
function loadTable() {
  const sel = document.getElementById('table-select');
  const verb = verbs[parseInt(sel.value)];
  const grid = document.getElementById('conj-grid');
  grid.innerHTML = '';
  pronouns.forEach(p => {
    const cell = document.createElement('div');
    cell.className = 'conj-cell';
    cell.innerHTML = `<div class="conj-pronoun">${p}</div>
      <input class="conj-input" data-pronoun="${p}" data-answer="${verb.forms[p]}" placeholder="...">`;
    grid.appendChild(cell);
  });
}

function checkTable() {
  document.querySelectorAll('.conj-input').forEach(inp => {
    const ans = inp.value.trim().toLowerCase();
    const correct = inp.dataset.answer;
    inp.className = 'conj-input ' + (ans === correct ? 'ok' : ans === '' ? '' : 'bad');
  });
}

function showTable() {
  document.querySelectorAll('.conj-input').forEach(inp => {
    inp.value = inp.dataset.answer;
    inp.className = 'conj-input ok';
  });
}

// LIST MODE
function buildList() {
  const container = document.getElementById('verb-list');
  container.innerHTML = '';
  verbs.forEach(v => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:0.88rem;';
    row.innerHTML = `<span style="color:var(--accent); font-family:'Playfair Display',serif; font-size:1rem">${v.inf}</span><span style="color:var(--muted)">${v.meaning}</span>`;
    container.appendChild(row);
  });
}

// MODES
function setMode(mode) {
  document.getElementById('mode-quiz').style.display = mode === 'quiz' ? 'contents' : 'none';
  document.getElementById('mode-table').style.display = mode === 'table' ? 'block' : 'none';
  document.getElementById('mode-list').style.display = mode === 'list' ? 'block' : 'none';
  document.querySelectorAll('.mode-tab').forEach((t, i) => {
    t.className = 'mode-tab' + (['quiz','table','list'][i] === mode ? ' active' : '');
  });
  if (mode === 'table') {
    const sel = document.getElementById('table-select');
    if (!sel.options.length) {
      verbs.forEach((v, i) => { sel.add(new Option(`${v.inf} — ${v.meaning}`, i)); });
    }
    loadTable();
  }
  if (mode === 'list') buildList();
}

// Init
buildQueue();
nextQuestion();
</script>
</body>
</html>
